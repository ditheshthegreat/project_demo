version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: inklusio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: inklusio_user
      POSTGRES_PASSWORD: inklusio_pass
      POSTGRES_DB: inklusio
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inklusio_user -d inklusio']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
